<path class="w g" pathLength="1" style="animation-delay:1195ms" d="M6 10 L19 38 L32 20 Z"/>
<path class="w g" pathLength="1" style="animation-delay:1240ms" d="M6 56 L19 38 L32 56 Z"/>
<path class="w g" pathLength="1" style="animation-delay:1285ms" d="M19 38 L32 20 L45 38 Z"/>
<path class="w g" pathLength="1" style="animation-delay:1330ms" d="M19 38 L45 38 L32 56 Z"/>
<path class="w g" pathLength="1" style="animation-delay:1375ms" d="M32 20 L58 10 L45 38 Z"/>
<path class="w g" pathLength="1" style="animation-delay:1420ms" d="M45 38 L58 10 L58 56 Z"/>
<path class="w g" pathLength="1" style="animation-delay:1465ms" d="M45 38 L58 56 L32 56 Z"/></g>
