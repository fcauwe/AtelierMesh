<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="256" height="256" role="img" aria-label="AtelierMesh">
<title>AtelierMesh</title>
<style>
/* AtelierMesh intro, 3.0 s, plays once. Line style of the first intro.
   1 the A of Atelier in thin orange lines, 2 the M as a letter, 3 every triangle of the mesh,
   4 the STL triangles grow over the lines, the orange one lands last, all lines fade together. */
.w{fill:none;stroke-width:.6;stroke-linejoin:round;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw .5s cubic-bezier(.4,0,.2,1) forwards, fade .4s 2650ms cubic-bezier(.4,0,.2,1) forwards}
.s{animation:draw .5s cubic-bezier(.4,0,.2,1) forwards, fade .6s cubic-bezier(.4,0,.2,1) forwards}
.a{stroke:#f97316}
.g{stroke:#737373}
.f{opacity:0;transform-box:fill-box;transform-origin:center;transform:scale(.6);animation:facet .32s cubic-bezier(.4,0,.2,1) forwards}
.o{opacity:0;transform-box:fill-box;transform-origin:center;transform:translateY(-8px);animation:land .38s cubic-bezier(.4,0,.2,1) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fade{to{opacity:0}}
@keyframes facet{to{opacity:1;transform:none}}
@keyframes land{to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.w{display:none}.f,.o{animation:none;opacity:1;transform:none}}
</style>
<g><path class="w s a" pathLength="1" style="animation-delay:0ms,350ms" d="M6 56 L32 20 L58 56"/>
<path class="w s a" pathLength="1" style="animation-delay:45ms,395ms" d="M19 38 L45 38"/>
<path class="w s g" pathLength="1" style="animation-delay:450ms,800ms" d="M6 56 L6 10 L32 20 L58 10 L58 56"/>
